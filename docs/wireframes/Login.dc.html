<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#141413;background:#FAF9F5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#B4532A}a:hover{color:#8A3D1D}
</style>
</helmet>
<div style="width: 1080px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: #FAF9F5; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #141413">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 28px; height: 28px; border-radius: 7px; background: #141413"></div>
<span style="font-size: 17px; font-weight: 600">[App name]</span>
<span style="font-size: 12px; color: #5E5D59; padding: 2px 8px; border: 1px solid #E3E1DA; border-radius: 999px">Prototype</span>
</div>
<form aria-labelledby="signin-title" style="width: 400px; box-sizing: border-box; padding: 32px; background: #FFFFFF; border: 1px solid #E3E1DA; border-radius: 16px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 id="signin-title" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 600">Sign in</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5E5D59">This is a private prototype. Use the username and password you were sent.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="user" style="font-size: 13px; font-weight: 600">Username</label>
<input id="user" type="text" autocomplete="username" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #FFFFFF; border: 1px solid #D6D3CB; border-radius: 10px; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pass" style="font-size: 13px; font-weight: 600">Password</label>
<input id="pass" type="password" autocomplete="current-password" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #FFFFFF; border: 1px solid #D6D3CB; border-radius: 10px; font-size: 15px">
</div>
<p role="alert" style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #FDF0EE; border: 1px solid #F1C4BD; border-radius: 10px; font-size: 13px; color: #8F1D14">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
That username and password don’t match. Check the details you were sent.
</p>
<button type="submit" style="min-height: 44px; background: #B4532A; color: #FFFFFF; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer">Sign in</button>
</form>
<p style="margin: 0; font-size: 13px; color: #5E5D59">Access is limited to invited reviewers.</p>
</div>
</x-dc>

return {};
}
}
</script>
</body>
</html>
